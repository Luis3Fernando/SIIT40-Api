version: '3.8'
services:
  db_siit:
    image: postgres:15-alpine
    container_name: db_siit_tesis
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - siit_postgres_data:/var/lib/postgresql/data
    networks:
      - siit_net

  siit-api:
    build: .
    container_name: siit_api_tesis
    restart: always
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - BASE_URL=${BASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
    ports:
      - "8002:80"
    depends_on:
      - db_siit
    networks:
      - siit_net
      - proxy_network 

networks:
  siit_net:
  proxy_network:
    external: true

volumes:
  siit_postgres_data: