name: Deploy SIIT40 API

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Asegurar que el directorio base existe
            mkdir -p ~/proyectos
            cd ~/proyectos

            # 2. Clonar si no existe, o limpiar y actualizar si ya existe
            if [ ! -d "siit-api" ]; then
              git clone https://github.com/Luis3Fernando/SIIT40-Api.git siit-api
              cd siit-api
            else
              cd siit-api
              git fetch origin main
              git reset --hard origin/main
            fi

            # 3. Levantar usando la ruta absoluta del binario que instalamos
            # Esto evita el error de "command not found" y limpia contenedores viejos
            /home/ubuntu/.docker/cli-plugins/docker-compose up -d --build --remove-orphans